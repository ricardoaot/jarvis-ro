# ─────────────────────────────────────────────────────────────────────────────
# Jarvis — configuración de Hermes Agent (versionada)
#
# Este fichero es la fuente de verdad. ~/.hermes/config.yaml es un symlink aquí.
# Hermes usa valores por defecto para todo lo que no aparezca; la plantilla
# completa que genera el instalador queda en ~/.hermes/config.yaml.installer-template
# como referencia para diffs al actualizar.
#
# SIN SECRETOS. La API key se inyecta desde el entorno (ver scripts/jarvis.sh).
# ─────────────────────────────────────────────────────────────────────────────

# ── Cerebro ──────────────────────────────────────────────────────────────────
# Anthropic directo con API key por tokens.
# NO usar provider "nous" ni `hermes setup --portal`: eso es OAuth de
# suscripción, y Hermes factura ese uso como "extra usage" aparte de la cuota.
model:
  provider: "anthropic"
  default: "anthropic/claude-haiku-4.5"

# ── STT: Whisper local ───────────────────────────────────────────────────────
# provider "local" = faster-whisper en la máquina. Sin API key, sin red.
# El modelo "base" (~150MB) se descarga solo en la primera transcripción.
stt:
  enabled: true
  provider: "local"
  # OJO: el default del código es "en". Sin esta línea, el español se
  # transcribiría forzado a inglés. Cambia a "" para autodetectar.
  language: "es"
  local:
    model: "base"          # tiny | base | small | medium | large-v3 | turbo
    # vad: true por defecto (Silero) — filtra silencio y evita que whisper
    # alucine texto a partir de ruido. Importante para la fase 4.

# ── TTS / wake word ──────────────────────────────────────────────────────────
# Se añaden al validar cada fase, no antes.
#
# AVISO para la fase 3: el default de tts.provider es "edge", que es TTS de RED.
# Hay que sobrescribirlo explícitamente a "piper" (local).

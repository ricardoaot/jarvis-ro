# ─────────────────────────────────────────────────────────────────────────────
# Jarvis — configuración de Hermes Agent (versionada)
#
# Este fichero es la fuente de verdad. ~/.hermes/config.yaml es un symlink aquí.
# Hermes usa valores por defecto para todo lo que no aparezca; la plantilla
# completa que genera el instalador queda en ~/.hermes/config.yaml.installer-template
# como referencia para diffs al actualizar.
#
# SIN SECRETOS. La API key se inyecta desde el entorno (ver scripts/jarvis.sh).
# ─────────────────────────────────────────────────────────────────────────────

# ── Cerebro ──────────────────────────────────────────────────────────────────
# Anthropic directo con API key por tokens.
# NO usar provider "nous" ni `hermes setup --portal`: eso es OAuth de
# suscripción, y Hermes factura ese uso como "extra usage" aparte de la cuota.
model:
  provider: "anthropic"
  # Forma canónica: Hermes normaliza "claude-haiku-4.5" a "claude-haiku-4-5" y
  # avisa por pantalla cada arranque. Lo escribimos ya normalizado.
  default: "anthropic/claude-haiku-4-5"

# ── STT: Whisper local ───────────────────────────────────────────────────────
# provider "local" = faster-whisper en la máquina. Sin API key, sin red.
# El modelo "base" (~150MB) se descarga solo en la primera transcripción.
stt:
  enabled: true
  provider: "local"
  # FIJADO A ESPAÑOL a propósito. Estuvo en "" (autodetección bilingüe) y fue
  # una regresión: Whisper detecta el idioma sobre frases cortas y se equivoca
  # a menudo. Visto en el log, alternaba lang=es / lang=en sobre la misma voz, y
  # cuando el audio es flojo cae a inglés por defecto (medido: confianza 0.59 y
  # 0.39, apenas por encima del azar). El resultado es que "no te entiende".
  #
  # El default del código es "en", así que esta línea es obligatoria igualmente.
  #
  # Coste: el STT ya no entiende inglés. Se asume: la voz de TTS es española, y
  # una respuesta en inglés se locutaría con fonética española de todos modos.
  language: "es"
  local:
    model: "base"          # tiny | base | small | medium | large-v3 | turbo
    # vad: true por defecto (Silero) — filtra silencio y evita que whisper
    # alucine texto a partir de ruido. Importante para la fase 4.

# ── TTS: Piper local ─────────────────────────────────────────────────────────
# IMPRESCINDIBLE fijar provider. El default del código es "edge", que es TTS
# de RED (Microsoft). Piper sintetiza en la máquina, sin red y sin API key.
#
# La voz se descarga sola la primera vez a ~/.hermes/cache/piper-voices/.
# Catálogo: https://github.com/OHF-Voice/piper1-gpl/blob/main/docs/VOICES.md
#
# LIMITACIÓN CONOCIDA — no hay TTS bilingüe:
#   tools/tts_tool_local.py resuelve la voz como
#     voice_name = piper_config.get("voice") or DEFAULT_PIPER_VOICE
#   Es una voz estática: Hermes no detecta el idioma de la respuesta ni cambia
#   de voz. Una voz de Piper habla un solo idioma. El STT sí es bilingüe
#   (stt.language: ""), y el modelo contesta en el idioma en que le hables,
#   pero ese texto se locutará SIEMPRE con fonética española.
tts:
  provider: "piper"
  piper:
    voice: "es_ES-davefx-medium"

# Hablar las respuestas automáticamente al entrar en modo voz.
# OJO: por el bug hermes-agent#74328 esto NO se aplica a los turnos lanzados
# por wake word. Ver docs/portabilidad.md §2.2.
voice:
  auto_tts: true

# ── Wake word ────────────────────────────────────────────────────────────────
# Detección 100% on-device: no sale audio de la máquina hasta que hablas.
#
# Motor: openWakeWord con el modelo entrenado "hey_jarvis" (built-in). Se
# prefiere a sherpa por dos razones: sherpa es vocabulario abierto y SOLO
# inglés (ver _sherpa_model_root en tools/wake_word_engines.py), y openWakeWord
# es el único motor con confirmation_frames, que es la palanca buena contra
# falsos positivos.
#
# En Apple Silicon el framework se resuelve solo a tflite. NO pongas "onnx"
# aquí: es un camino muerto en esta plataforma (openWakeWord#336). Hermes lo
# coacciona a tflite igualmente, pero mejor no pedirlo. Ver portabilidad §2.1.
wake_word:
  enabled: true
  provider: openwakeword
  phrase: "hey hermes"        # etiqueta; la detección la fija el modelo
  # false a propósito. Con true, _on_wake_word llama a new_session() ANTES de
  # arrancar la grabación, y esa llamada es lenta (cierra sesión, vuelca memoria,
  # escribe en la base de datos). Ese retraso entre soltar el micro y empezar a
  # grabar es donde se cuelga el turno. Ver portabilidad §2.10 y §2.12.
  # Efecto secundario, deseable aquí: la conversación continúa en una sola
  # sesión en vez de empezar de cero en cada "hey hermes".
  start_new_session: false
  # ── Palancas contra falsos positivos (criterio de aceptación: <3 al día) ──
  sensitivity: 0.6            # 0.0-1.0. MÁS ALTO = MÁS ESTRICTO. Sube a 0.8.
  confirmation_frames: 3      # frames consecutivos sobre umbral. Sube a 4-5.
  openwakeword:
    # hey_jarvis NO sirve aquí: entrenado con inglés, con voz española puntúa
    # ~0.23-0.40 contra el umbral 0.60 y no dispara nunca. Ver portabilidad §2.7.
    # hey_hermes es el modelo que Hermes trae de serie (tools/wakewords/) y
    # aguanta bien la fonética española: 0.965.
    model: hey_hermes
    inference_framework: ""   # "" = auto -> tflite en macOS ARM64

# ── Logging ──────────────────────────────────────────────────────────────────
# DEBUG temporalmente mientras se diagnostica el wake word. El bucle _run de
# tools/wake_word.py se traga los errores de motor en DEBUG
# ("wake word: engine error"), y también registra ahí las detecciones
# descartadas por cooldown. Con INFO ambos son invisibles.
# Vuelve a "INFO" cuando el wake word esté validado: DEBUG llena el log.
logging:
  level: "DEBUG"
